name: Publish to PyPI

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag_name:
        description: Existing v-prefixed GitHub release tag to publish
        required: true
        type: string

permissions: {}

concurrency:
  group: pypi-${{ inputs.tag_name || github.event.release.tag_name }}
  cancel-in-progress: false

jobs:
  test:
    name: Validate release
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.tag_name || github.event.release.tag_name }}

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - run: python -m pip install -e ".[dev]"
      - run: pytest

  build:
    name: Build and inspect distributions
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.tag_name || github.event.release.tag_name }}

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - run: python -m pip install --upgrade build "twine>=6.0"
      - run: python -m build
      - run: python -m twine check dist/*

      - name: Require release tag to match artifact version
        env:
          RELEASE_TAG: ${{ inputs.tag_name || github.event.release.tag_name }}
        run: |
          expected="${RELEASE_TAG#v}"
          actual="$(python -c 'import glob, pathlib; print(pathlib.Path(glob.glob("dist/*.whl")[0]).name.split("-")[1])')"
          test "$actual" = "$expected"

      - uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist/

  publish:
    name: Publish to PyPI
    needs: [build, attest]
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/rqm-optimize
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist/

      - uses: pypa/gh-action-pypi-publish@release/v1

  attest:
    name: Attest release artifacts
    needs: build
    runs-on: ubuntu-latest
    permissions:
      attestations: write
      contents: read
      id-token: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist/

      - uses: actions/attest@v4
        with:
          subject-path: |
            dist/*.whl
            dist/*.tar.gz

  attach:
    name: Attach distributions to GitHub Release
    needs: [build, attest]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist/

      - name: Create checksums and upload release assets
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ inputs.tag_name || github.event.release.tag_name }}
        run: |
          (cd dist && sha256sum * > SHA256SUMS)
          gh release upload "$RELEASE_TAG" dist/* --clobber
