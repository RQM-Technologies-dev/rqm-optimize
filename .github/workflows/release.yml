name: Release management

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions: {}

concurrency:
  group: release-management
  cancel-in-progress: false

jobs:
  release:
    name: Prepare or create release
    runs-on: ubuntu-latest
    permissions:
      actions: write
      contents: write
      pull-requests: write
    steps:
      - name: Run Release Please
        id: release
        uses: googleapis/release-please-action@v5
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

      - name: Dispatch CI for the release pull request
        if: ${{ steps.release.outputs.pr != '' }}
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_PR: ${{ steps.release.outputs.pr }}
        run: |
          pr_number="$(jq -r '.number' <<<"$RELEASE_PR")"
          pr_branch="$(gh pr view "$pr_number" --repo "$GITHUB_REPOSITORY" --json headRefName --jq .headRefName)"
          pr_title="$(jq -r '.title' <<<"$RELEASE_PR")"
          gh workflow run ci.yml --repo "$GITHUB_REPOSITORY" --ref "$pr_branch"
          gh workflow run pr-title.yml --repo "$GITHUB_REPOSITORY" --ref "$pr_branch" --field pr_title="$pr_title"

      - name: Dispatch protected PyPI publication
        if: ${{ steps.release.outputs.release_created == 'true' }}
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.release.outputs.tag_name }}
        run: |
          gh workflow run publish.yml \
            --repo "$GITHUB_REPOSITORY" \
            --ref "$RELEASE_TAG" \
            --field tag_name="$RELEASE_TAG"
